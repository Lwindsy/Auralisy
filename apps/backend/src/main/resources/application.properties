server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
server.forward-headers-strategy=none
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=16
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=8KB
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.task.scheduling.pool.size=2
spring.main.banner-mode=off
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,python,dispatch
management.endpoint.health.group.liveness.include=livenessState
logging.level.root=OFF
logging.level.io.auralisy.discovery.application.RoundDispatcher=WARN
logging.level.io.auralisy.bootstrap.DispatchLifecycle=WARN

spring.application.name=auralisy-java
management.tracing.sampling.probability=${AURALIS_TRACE_SAMPLE_RATE:0.0}
management.otlp.tracing.endpoint=${AURALIS_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.otlp.tracing.export.enabled=${AURALIS_TELEMETRY_ENABLED:false}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

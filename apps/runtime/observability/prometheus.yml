global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: auralisy-java
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/java-service-token
    http_headers:
      X-Auralis-Audience:
        values: [coordinator]
    static_configs:
      - targets: [host.docker.internal:18080]
  - job_name: auralisy-python
    static_configs:
      - targets: [collector:8889]

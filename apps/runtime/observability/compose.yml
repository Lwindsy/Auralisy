name: auralisy-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/config.yaml"]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:8889:8889"]
    volumes: ["./collector.yaml:/etc/otel/config.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./java-service-token:/etc/prometheus/java-service-token:ro
      - metrics:/prometheus
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro", "traces:/var/tempo"]
  grafana:
    image: grafana/grafana:12.2.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/auralisy.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/auralisy.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/auralisy.json:ro
      - grafana:/var/lib/grafana
volumes:
  metrics:
  traces:
  grafana:
